
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Laptop Hardware Explainer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101114;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 24px 20px;
      text-align: center;
      background: linear-gradient(135deg, #191919, #332313);
      border-bottom: 2px solid #d6a447;
    }

      margin: 0 0 10px;

      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 24px 16px;
    }

      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000000;
      border: 1px solid #a8792d;
      border-radius: 12px;
      box-shadow: 0 0 28px rgba(214, 164, 71, 0.12);
    }

    .video-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .actions a {
      display: inline-block;
      padding: 12px 20px;
      color: #111111;
      background: #e4b44f;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .actions a:hover {
      background: #ffd77b;
    }
